<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body, #map { height: 100%; margin: 0; }
    body { background: #e8eef4; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #fallback { height: 100%; display: grid; place-items: center; padding: 24px; box-sizing: border-box; color: #2e4057; text-align: center; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const config = new URLSearchParams(window.location.search);
    const key = config.get('key') || '';
    const lat = Number(config.get('lat') || 43.238);
    const lng = Number(config.get('lng') || 76.945);
    const label = decodeURIComponent(config.get('label') || 'ЖК');
    function initMap() {
      const map = new google.maps.Map(document.getElementById('map'), { center: { lat, lng }, zoom: 14, disableDefaultUI: false, mapTypeControl: false });
      new google.maps.Marker({ position: { lat, lng }, map, title: label });
    }
    if (key) {
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=initMap`;
      script.async = true;
      script.defer = true;
      document.head.appendChild(script);
    } else {
      document.getElementById('map').innerHTML = '<div id="fallback"><div><strong>Google Maps пока не подключена</strong><br><br>Добавь GOOGLE_MAPS_API_KEY в файл .env.<br>Кнопка ниже откроет выбранный адрес в Google Maps без ключа.</div></div>';
    }
  </script>
</body>
</html>
