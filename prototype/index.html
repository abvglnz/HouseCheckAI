<title>HouseCheck AI 2.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: navy sidebar + warm workspace; white cards with large radii; orange accent (HouseCheck AI / NGIJIH tokens) */
:root{
  --bg:#FFF6EE; --surface:#FFFFFF; --muted:#FFF4EA; --text:#17233F; --text-2:#7A8498; --text-3:#A3ABBB;
  --accent:#F28A3C; --accent-2:#FFB37A; --accent-soft:#FFE6D2; --border:#F0E3D8; --border-2:#E4D2C3; --grid:#F6ECE4;
  --nav:#17233F; --nav-2:#22305A; --nav-muted:#9AA6C0; --on-dark:#FFFFFF; --on-dark-2:#C9D2E6;
  --pos:#3F9B5A; --pos-soft:#DDF3E3; --warn:#D9822B; --warn-soft:#FFF0DC; --danger:#E0584B; --danger-soft:#FDE3E0;
  --sky:#DCEEFF; --mint:#DBF5E6; --lilac:#ECE6FF; --land:#F7EFE6; --park:#D9EFD3; --water:#B9DCF5; --road:#FFFFFF;
  --shadow:0 10px 28px rgba(138,90,58,.10); --shadow-h:0 18px 40px rgba(138,90,58,.18); --float:0 18px 44px rgba(23,35,63,.28);
  --font:"Poppins","Segoe UI",system-ui,-apple-system,sans-serif;
  --r-lg:24px; --r-md:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1426; --surface:#1A2140; --muted:#212A4D; --text:#F4F6FF; --text-2:#A6B0C9; --text-3:#6E7898;
  --accent-soft:#3B2A2A; --border:#2A3358; --border-2:#36406A; --grid:#263056; --nav:#0A0F1F; --nav-2:#161D38;
  --pos:#7FD99A; --pos-soft:#1C3A2A; --warn:#F4B36E; --warn-soft:#3A2E1E; --danger-soft:#3D2026;
  --sky:#1F3352; --mint:#1D3A2E; --lilac:#2B2850; --land:#1A2140; --park:#1F3A33; --water:#24446B; --road:#283160;
  --shadow:0 10px 28px rgba(0,0,0,.35); --shadow-h:0 18px 40px rgba(0,0,0,.5); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1426; --surface:#1A2140; --muted:#212A4D; --text:#F4F6FF; --text-2:#A6B0C9; --text-3:#6E7898;
  --accent-soft:#3B2A2A; --border:#2A3358; --border-2:#36406A; --grid:#263056; --nav:#0A0F1F; --nav-2:#161D38;
  --pos:#7FD99A; --pos-soft:#1C3A2A; --warn:#F4B36E; --warn-soft:#3A2E1E; --danger-soft:#3D2026;
  --sky:#1F3352; --mint:#1D3A2E; --lilac:#2B2850; --land:#1A2140; --park:#1F3A33; --water:#24446B; --road:#283160;
  --shadow:0 10px 28px rgba(0,0,0,.35); --shadow-h:0 18px 40px rgba(0,0,0,.5); color-scheme:dark }
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;color:var(--text)}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.side{background:linear-gradient(180deg,var(--nav-2),var(--nav));color:var(--on-dark);display:flex;flex-direction:column;gap:4px;padding:24px 16px 18px;position:relative;overflow:hidden}
.side::after{content:"";position:absolute;right:-90px;top:-90px;width:200px;height:200px;border-radius:50%;background:rgba(242,138,60,.12);pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px rgba(242,138,60,.35)}
.mark .ic{width:22px;height:22px}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.2px}
.brand small{color:var(--nav-muted);font-size:11px;font-weight:600}
.sec-label{color:var(--nav-muted);font-size:10px;font-weight:800;letter-spacing:.12em;margin:8px 4px 4px}
.nav{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px 0 14px;border-radius:14px;color:var(--nav-muted);font-weight:600;font-size:13px;position:relative;transition:color .2s,background .2s;text-align:left}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav .ic{width:20px;height:20px}
.nav.active{color:#fff;background:linear-gradient(90deg,var(--accent),var(--accent-2));box-shadow:0 8px 20px rgba(242,138,60,.28)}
.nav .cnt{margin-left:auto;background:var(--accent);color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:1px 8px;min-width:24px;text-align:center;transition:transform .25s}
.nav.active .cnt{background:#fff;color:var(--accent)}
.nav .cnt.bump{transform:scale(1.35)}
.promo{margin-top:auto;background:linear-gradient(135deg,var(--accent-2),var(--accent));border-radius:22px;padding:14px 10px 14px 16px;display:flex;align-items:center;gap:6px;text-align:left;color:#fff;transition:transform .2s,box-shadow .2s}
.promo:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(242,138,60,.4)}
.promo b{font-size:13px;font-weight:800;line-height:1.3}
.promo span{display:block;font-size:11px;color:#FFF3E8;margin-top:2px}
.side-note{color:var(--nav-muted);font-size:10px;line-height:1.45;margin-top:10px}

.main{display:flex;flex-direction:column;min-width:0;height:100%}
.top{height:72px;flex:none;display:flex;align-items:center;gap:12px;padding:0 max(24px,env(safe-area-inset-right,0px)) 0 32px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);position:relative;z-index:5}
.searchbtn{flex:1;max-width:520px;height:46px;border-radius:23px;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 8px 0 18px;color:var(--text-3);transition:border-color .2s,box-shadow .2s}
.searchbtn:hover{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent)}
.searchbtn span{flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:700 11px var(--font);background:var(--muted);color:var(--text-2);border-radius:8px;padding:5px 9px}
.spacer{flex:1}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:20px;background:var(--muted);border:1px solid var(--border);position:relative}
.seg button{position:relative;z-index:1;height:30px;min-width:38px;padding:0 12px;border-radius:15px;font-size:12px;font-weight:600;color:var(--text-2);display:grid;place-items:center;transition:color .2s}
.seg button.on{color:#fff}
.seg .knob{position:absolute;top:4px;height:30px;border-radius:15px;background:var(--accent);transition:left .3s cubic-bezier(.2,.8,.2,1),width .3s;box-shadow:0 4px 12px rgba(242,138,60,.35)}
.seg .ic{width:16px;height:16px}
.user{display:flex;align-items:center;gap:10px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;background:linear-gradient(135deg,var(--accent-2),var(--accent));flex:none}
.user b{display:block;font-size:13px}.user small{color:var(--text-2);font-size:11px;font-weight:500}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:background .2s,color .2s}
.iconbtn:hover{background:var(--accent-soft);color:var(--accent)}

.view{flex:1;overflow-y:auto;overflow-x:hidden;padding:28px max(36px,env(safe-area-inset-right,0px)) 120px max(36px,env(safe-area-inset-left,0px))}
.view>.page{animation:enter .45s cubic-bezier(.2,.8,.2,1) both;display:flex;flex-direction:column;gap:20px;max-width:1400px;margin:0 auto}
@keyframes enter{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.stagger>*{animation:enter .5s cubic-bezier(.2,.8,.2,1) both}
.stagger>*:nth-child(2){animation-delay:.05s}.stagger>*:nth-child(3){animation-delay:.1s}.stagger>*:nth-child(4){animation-delay:.15s}.stagger>*:nth-child(5){animation-delay:.2s}.stagger>*:nth-child(6){animation-delay:.25s}.stagger>*:nth-child(n+7){animation-delay:.3s}

/* ---------- primitives ---------- */
h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:0;text-wrap:balance}
h2{font-size:19px;font-weight:800;margin:0}
.sub{color:var(--text-2);margin:4px 0 0;font-size:14px}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head>div:first-child{flex:1;min-width:220px}
.btn{height:40px;display:inline-flex;align-items:center;gap:8px;padding:0 18px;border-radius:20px;font-weight:600;font-size:13px;white-space:nowrap;transition:transform .12s,background .2s,box-shadow .2s,border-color .2s,color .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 6px 18px rgba(242,138,60,.35)}
.btn.primary:hover{background:#E5782A;box-shadow:0 10px 24px rgba(242,138,60,.45)}
.btn.secondary{background:var(--surface);border:1.2px solid var(--border)}
.btn.secondary:hover{border-color:var(--accent);background:var(--muted)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.soft:hover{background:color-mix(in srgb,var(--accent) 22%,var(--accent-soft))}
.btn.dark{background:var(--nav);color:#fff}
.btn.glass{background:rgba(255,255,255,.12);color:#fff}
.btn.glass:hover{background:rgba(255,255,255,.22)}
.btn.ghost:hover{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.lg{height:50px;padding:0 24px;font-size:15px;border-radius:25px}
.btn.sm{height:34px;padding:0 14px;font-size:12px}
.chip{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--border);background:var(--surface);font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .2s,color .2s,border-color .2s}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--nav);color:#fff;border-color:var(--nav)}
:root[data-theme="dark"] .chip.on{background:var(--accent);border-color:var(--accent)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .chip.on{background:var(--accent);border-color:var(--accent)}}
.chip .ic{width:15px;height:15px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border-radius:10px;padding:3px 10px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.pos{background:var(--pos-soft);color:var(--pos)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.neutral{background:var(--muted);color:var(--text-2)}.badge.light{background:#fff;color:#17233F}.badge.navy{background:#17233F;color:#fff}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s}
.card.hover:hover{transform:translateY(-4px);box-shadow:var(--shadow-h);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.dark-card{background:linear-gradient(135deg,var(--nav-2),var(--nav));color:#fff;border-radius:26px;box-shadow:var(--float);position:relative;overflow:hidden}
.dark-card::before{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.06);pointer-events:none}
.bubble{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--accent-soft);color:var(--accent)}
.bubble .ic{width:22px;height:22px}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tnum{font-variant-numeric:tabular-nums}

/* ring */
.ring{position:relative;display:grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .trk{stroke:var(--grid)}
.ring .val{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring b{position:absolute;font-weight:800;letter-spacing:-.5px}
.ring small{position:absolute;bottom:22%;font-size:10px;font-weight:600;color:var(--text-2)}
.dark-card .ring .trk{stroke:rgba(255,255,255,.16)}
.dark-card .ring small{color:var(--on-dark-2)}

/* complex card */
.dev{padding:12px 12px 16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;position:relative}
.dev.sel{border-color:var(--accent);border-width:2px;padding:11px 11px 15px}
.cover{position:relative;border-radius:var(--r-md);overflow:hidden;height:150px;background:var(--accent-soft)}
.cover canvas{width:100%;height:100%;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.dev:hover .cover canvas{transform:scale(1.05)}
.cover .tl{position:absolute;left:12px;top:12px}
.fav{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.3);color:#fff;backdrop-filter:blur(4px);transition:transform .2s,background .2s}
.fav:hover{transform:scale(1.12)}
.fav.on{background:var(--accent)}
.fav.on .ic{fill:#fff}
.fav.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.35)}}
.dev .row{display:flex;align-items:center;gap:10px;padding:0 4px}
.dev .name{font-size:17px;font-weight:800;line-height:1.25}
.dev .addr{color:var(--text-2);font-size:12px;margin-top:2px}
.dev .rv{color:var(--accent);font-size:12px;font-weight:600}
.dev .pl{font-size:10px;color:var(--text-2);font-weight:500}
.dev .pv{font-weight:800;font-size:14px}
.stars{display:inline-flex;gap:1px;color:#F5A524}
.stars .ic{width:13px;height:13px;stroke-width:1.6}
.stars .f{fill:#F5A524}
.stars .e{color:var(--border-2)}
.dev .foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px}
.match{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:var(--text-2);padding:0 4px}
.bar{flex:1;height:7px;border-radius:4px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent-2),var(--accent));width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}

/* home */
.hero{padding:32px 30px 30px 36px;display:flex;align-items:center;gap:20px}
.hero h1{font-size:34px;color:#fff;margin:12px 0 10px}
.hero p{color:var(--on-dark-2);font-size:15px;line-height:1.6;max-width:620px;margin:0 0 20px}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.hero .mascot{width:190px;height:190px;flex:none}
.stats{display:grid;gap:16px;grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{display:flex;align-items:center;gap:14px;padding:18px 20px}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1.1}
.stat small{color:var(--text-2);font-size:12px;font-weight:500}

/* review */
.rev{padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.rev .hd{display:flex;align-items:center;gap:10px}
.rev .hd b{display:block;font-size:14px}
.rev .hd small{color:var(--text-2);font-size:11px}
.rev p{margin:0;line-height:1.6;font-size:13px}
.rev .ft{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.link{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;border-radius:10px;padding:3px 6px;transition:color .2s,background .2s}
.link:hover{color:var(--accent);background:var(--accent-soft)}
.link .ic{width:15px;height:15px}

/* filters */
.filters{padding:16px;display:flex;flex-direction:column;gap:12px}
.frow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.field{flex:1;min-width:220px;height:46px;border-radius:23px;border:1.5px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--text-3);transition:border-color .2s,box-shadow .2s}
.field:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.field input{flex:1;border:0;outline:0;background:none;font-size:14px;font-weight:500;min-width:0}
select.sel{height:46px;border-radius:14px;border:1.5px solid var(--border);background:var(--surface);padding:0 14px;font-weight:600;font-size:13px;outline:none}
select.sel:focus{border-color:var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chips .lbl{font-size:12px;font-weight:700;color:var(--text-2);margin-right:2px}
.found{color:var(--text-2);font-weight:600;font-size:13px;margin:0 4px}

.tray{position:fixed;left:calc(248px + (100% - 248px)/2);transform:translate(-50%,140%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:12px;padding:12px 12px 12px 18px;border-radius:24px;background:linear-gradient(135deg,#22305A,#17233F);color:#fff;box-shadow:var(--float);transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
.tray.show{transform:translate(-50%,0)}
.tray b{min-width:150px;font-size:14px}
.tray .bubble{background:#2B3A6B;color:var(--accent-2);width:40px;height:40px}

/* detail */
.dhero{padding:12px;display:flex;flex-direction:column;gap:12px}
.dcover{position:relative;height:280px;border-radius:22px;overflow:hidden}
.dcover canvas{width:100%;height:100%;display:block}
.dcover .over{position:absolute;inset:0;display:flex;flex-direction:column;padding:18px 22px 22px;color:#fff;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.35))}
.dcover .tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dcover h1{color:#fff;font-size:38px;margin-top:auto;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.dcover p{margin:4px 0 0;font-weight:500;opacity:.95}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:4px 8px 2px}
.cols{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
.score{padding:24px}
.score .rings{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.score h2{color:#fff}
.score p{color:var(--on-dark-2);margin:6px 0 0;line-height:1.5}
.pad{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.meter{display:grid;grid-template-columns:24px 120px minmax(0,1fr) 34px;align-items:center;gap:10px;font-size:13px;font-weight:600}
.meter .ic{color:var(--text-2)}
.meter b{text-align:right;font-weight:800}
.meter .bar{height:8px}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.fact{display:flex;align-items:center;gap:10px}
.fact .bubble{width:38px;height:38px;border-radius:12px;background:var(--muted)}
.fact .bubble .ic{width:18px;height:18px}
.fact small{display:block;color:var(--text-2);font-size:11px;font-weight:600}
.fact b{font-size:15px;font-weight:800}
textarea.note{width:100%;min-height:110px;resize:vertical;border-radius:16px;border:1.5px solid var(--border);background:var(--muted);padding:12px 14px;font-size:13px;line-height:1.5;outline:none}
textarea.note:focus{border-color:var(--accent)}

/* map */
.maplay{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;min-height:600px}
.mapbox{padding:8px;position:relative;min-height:520px}
.mapsvg{width:100%;height:100%;min-height:500px;border-radius:20px;display:block;background:var(--land);touch-action:none;cursor:grab}
.mapsvg:active{cursor:grabbing}
.pin{cursor:pointer}
.pin .head{transition:transform .25s cubic-bezier(.3,1.5,.5,1);transform-box:fill-box;transform-origin:50% 100%}
.pin:hover .head,.pin.on .head{transform:scale(1.25)}
.pin.on .pulse{animation:pulse 1.6s infinite}
@keyframes pulse{from{r:6;opacity:.55}to{r:30;opacity:0}}
.tip{position:absolute;pointer-events:none;background:var(--nav);color:#fff;border-radius:14px;padding:10px 14px;box-shadow:var(--float);transform:translate(-50%,calc(-100% - 46px));white-space:nowrap;transition:opacity .15s}
.tip b{display:block;font-size:14px}.tip small{color:var(--nav-muted);font-size:11px}
.legend{position:absolute;left:24px;bottom:24px;background:color-mix(in srgb,var(--surface) 92%,transparent);border-radius:16px;padding:7px 14px;display:flex;gap:14px;font-size:11px;font-weight:700;color:var(--text-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}

input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent-2),var(--accent)) 0/var(--p,0%) 100% no-repeat,var(--grid);outline:none}

function hash(s){let h=2166136261;for(const c of s)h=Math.imul(h^c.charCodeAt(0),16777619);return h>>>0}
function rng(seed){let a=seed;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function drawCover(cv,name){const r=cv.getBoundingClientRect();const w=Math.max(40,r.width),h=Math.max(40,r.height),dpr=Math.min(2,window.devicePixelRatio||1);cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext("2d");x.scale(dpr,dpr);
 const seed=hash(name),R=rng(seed),[top,mid,deep]=SKIES[seed%SKIES.length],night=top==="#3D4E85";
 let g=x.createLinearGradient(0,0,w*.3,h);g.addColorStop(0,top);g.addColorStop(1,mid);x.fillStyle=g;x.fillRect(0,0,w,h);
 const sx=w*(.62+R()*.24),sy=h*(.18+R()*.16),sr=h*.13;let rg=x.createRadialGradient(sx,sy,0,sx,sy,sr*3);rg.addColorStop(0,"rgba(255,250,230,.6)");rg.addColorStop(1,"rgba(255,250,230,0)");x.fillStyle=rg;x.beginPath();x.arc(sx,sy,sr*3,0,7);x.fill();
 x.fillStyle=night?"#E9ECFF":"#FFF6DA";x.beginPath();x.arc(sx,sy,sr,0,7);x.fill();
 x.fillStyle="rgba(255,255,255,.28)";for(let i=0;i<3;i++){const cx=R()*w,cy=h*(.1+R()*.3);for(let k=0;k<3;k++){x.beginPath();x.ellipse(cx+k*16,cy+(k%2)*4,18,10,0,0,7);x.fill()}}
 const rgb=h2=>[parseInt(h2.slice(1,3),16),parseInt(h2.slice(3,5),16),parseInt(h2.slice(5,7),16)],[dr,dg,db]=rgb(deep);
 x.fillStyle=`rgba(${dr},${dg},${db},.28)`;let px=-10;while(px<w){const bw=26+R()*22,bh=h*(.25+R()*.25);x.fillRect(px,h-bh,bw,bh);px+=bw+2+R()*8}
 px=-R()*20;while(px<w){const bw=34+R()*28,bh=h*(.38+R()*.4);x.fillStyle=`rgba(${dr},${dg},${db},.85)`;x.beginPath();x.roundRect?x.roundRect(px,h-bh,bw,bh+10,5):x.rect(px,h-bh,bw,bh+10);x.fill();
  x.fillStyle="rgba(255,230,168,.82)";for(let wy=h-bh+10;wy<h-8;wy+=11)for(let wx=px+6;wx<px+bw-6;wx+=9)if(R()<(night?.6:.45))x.fillRect(wx,wy,4,5);px+=bw+4+R()*8}
 g=x.createLinearGradient(0,h*.7,0,h);g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(0,0,0,.27)");x.fillStyle=g;x.fillRect(0,0,w,h)}
function paintCovers(root=document){requestAnimationFrame(()=>root.querySelectorAll("canvas[data-cover]").forEach(c=>drawCover(c,c.dataset.cover)))}

/* ---------- small builders ---------- */
function ring(v,size=58,stroke=6,caption=""){const r=(size-stroke)/2,c=2*Math.PI*r;return `<div class="ring" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}"><circle class="trk" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke-width="${stroke}"/><circle class="val" data-v="${v}" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${scoreColor(v)}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c}"/></svg><b class="tnum" data-count="${v}" style="font-size:${Math.round(size*.3)}px;${caption?"margin-top:-"+Math.round(size*.1)+"px":""}">0</b>${caption?`<small>${caption}</small>`:""}</div>`}
function animateIn(root){requestAnimationFrame(()=>requestAnimationFrame(()=>{
  root.querySelectorAll(".ring .val").forEach(el=>{const r=+el.getAttribute("r"),c=2*Math.PI*r;el.style.strokeDashoffset=c*(1-el.dataset.v/100)});
  root.querySelectorAll(".bar i[data-w]").forEach(el=>el.style.width=el.dataset.w+"%");
  root.querySelectorAll("[data-count]").forEach(el=>countUp(el,+el.dataset.count,el.dataset.dec?+el.dataset.dec:0))}))}
function countUp(el,to,dec=0){const t0=performance.now(),dur=1100;const step=n=>{const p=Math.min(1,(n-t0)/dur),e=1-Math.pow(1-p,3);el.textContent=(to*e).toFixed(dec).replace(/\B(?=(\d{3})+(?!\d))/g," ");if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}

const initials=n=>n.replace(/\./g,"").split(" ").filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const AV=["#F28A3C","#5B8DEF","#3FA77A","#7B6CF6","#E0584B","#D9822B","#2BB3C0"];
const avatar=(n,s=40)=>`<span class="avatar" style="width:${s}px;height:${s}px;font-size:${Math.round(s*.36)}px;background:linear-gradient(135deg,${AV[hash(n)%AV.length]}cc,${AV[hash(n)%AV.length]})">${esc(initials(n))}</span>`;

const RIVER=[[51.168,71.35],[51.16,71.372],[51.15,71.39],[51.138,71.402],[51.128,71.412],[51.122,71.425],[51.126,71.44],[51.138,71.452],[51.152,71.46],[51.158,71.475],[51.15,71.492],[51.138,71.51]];
const ROADS=[[[51.08,71.414],[51.11,71.414],[51.135,71.414],[51.165,71.412],[51.195,71.41]],[[51.075,71.44],[51.12,71.432],[51.15,71.43],[51.195,71.428]],[[51.16,71.355],[51.165,71.42],[51.17,71.505]],[[51.1,71.36],[51.1,71.44],[51.095,71.505]],[[51.135,71.36],[51.135,71.505]]];
const PARKS=[[51.1255,71.43,.0045,.01],[51.105,71.415,.004,.009],[51.143,71.443,.003,.007],[51.118,71.45,.0035,.008]];
const MLABELS=[["ЕСИЛЬ",51.098,71.39],["САРЫАРКА",51.185,71.385],["БАЙКОНУР",51.178,71.445],["АЛМАТЫ",51.15,71.49],["НУРА",51.067,71.47]];
const MW=1000,MH=Math.round(MW*(LAT1-LAT0)/((LNG1-LNG0)*KX));
const proj=(lat,lng)=>[((lng-LNG0)/(LNG1-LNG0))*MW,((LAT1-lat)/(LAT1-LAT0))*MH];
const pathOf=pts=>{const p=pts.map(([a,b])=>proj(a,b));let s=`M${p[0][0].toFixed(1)},${p[0][1].toFixed(1)}`;for(let i=1;i<p.length;i++){const m=[(p[i-1][0]+p[i][0])/2,(p[i-1][1]+p[i][1])/2];s+=` Q${p[i-1][0].toFixed(1)},${p[i-1][1].toFixed(1)} ${m[0].toFixed(1)},${m[1].toFixed(1)}`}const l=p[p.length-1];return s+` L${l[0].toFixed(1)},${l[1].toFixed(1)}`};
function pMap(){return `<div class="head"><div><h1>Карта районов</h1><p class="sub">Пины окрашены по индексу комфорта. Колесо мыши или кнопки — масштаб, перетаскивание — перемещение.</p></div></div>
 <div class="maplay"><section class="card mapbox"><svg class="mapsvg" id="msvg" viewBox="0 0 ${MW} ${MH}" preserveAspectRatio="xMidYMid meet"><g id="mg">
 <defs><pattern id="gridp" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs>
 <rect x="-2000" y="-2000" width="5000" height="5000" fill="url(#gridp)"/>
 ${PARKS.map(([la,ln,dl,dg])=>{const [x1,y1]=proj(la+dl,ln-dg),[x2,y2]=proj(la-dl,ln+dg);return `<rect x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" rx="14" fill="var(--park)"/>`}).join("")}
 ${ROADS.map(r=>`<path d="${pathOf(r)}" fill="none" stroke="var(--border-2)" stroke-width="9" stroke-linecap="round"/><path d="${pathOf(r)}" fill="none" stroke="var(--road)" stroke-width="5.5" stroke-linecap="round"/>`).join("")}
 <path d="${pathOf(RIVER)}" fill="none" stroke="var(--water)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/><path d="${pathOf(RIVER)}" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2" stroke-dasharray="8 10"/>
 ${MLABELS.map(([l,a,b])=>{const [x,y]=proj(a,b);return `<text x="${x}" y="${y}" text-anchor="middle" font-size="15" font-weight="800" fill="var(--text-3)" letter-spacing="2">${l}</text>`}).join("")}
 ${(()=>{const [x,y]=proj(51.133,71.398);return `<text x="${x}" y="${y-18}" text-anchor="middle" font-size="12" font-weight="700" fill="#3E7CB1">р. Есиль</text>`})()}
 <g id="pins">${[...DEVS].sort((a,b)=>b.lat-a.lat).map(d=>{const [x,y]=proj(d.lat,d.lng);return `<g class="pin" data-pin="${d.id}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})"><circle class="pulse" r="6" fill="${scoreColor(d.score)}" opacity="0"/><ellipse rx="7" ry="3" fill="rgba(0,0,0,.18)"/><g class="head"><path d="M0,0 C-5,-9 -14,-12 -14,-24 A14,14 0 1 1 14,-24 C14,-12 5,-9 0,0Z" fill="${scoreColor(d.score)}" stroke="#fff" stroke-width="2.5"/><text y="-20" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${d.score}</text></g></g>`}).join("")}</g></g></svg>
 <div class="tip" id="tip" style="opacity:0"></div><div class="zoom"><button id="zin" aria-label="Приблизить">+</button><button id="zout" aria-label="Отдалить">−</button></div>
 <div class="legend"><span><i style="background:var(--pos)"></i>80+</span><span><i style="background:var(--accent)"></i>65+</span><span><i style="background:var(--warn)"></i>50+</span><span><i style="background:var(--danger)"></i>&lt;50</span></div></section>
 <div class="col"><section class="dark-card pad" id="minfo" style="padding:22px"></section><section class="card mlist" id="mlist">${[...DEVS].sort((a,b)=>b.score-a.score).map(d=>`<button class="mitem" data-pinsel="${d.id}"><i class="dot" style="background:${scoreColor(d.score)}"></i><span>${esc(d.name)}</span><b class="tnum">${d.score}</b></button>`).join("")}</section></div></div>`}
function initMap(){const svg=document.getElementById("msvg"),g=document.getElementById("mg"),tip=document.getElementById("tip");let z=1,tx=0,ty=0,drag=null,moved=false;
 const apply=()=>g.setAttribute("transform",`translate(${tx},${ty}) scale(${z})`);
 const toSvg=(cx,cy)=>{const r=svg.getBoundingClientRect(),s=Math.min(r.width/MW,r.height/MH),ox=(r.width-MW*s)/2,oy=(r.height-MH*s)/2;return[(cx-r.left-ox)/s,(cy-r.top-oy)/s]};
 const zoomAt=(f,cx,cy)=>{const nz=Math.max(.8,Math.min(4,z*f)),[sx,sy]=toSvg(cx,cy);tx=sx-(sx-tx)*nz/z;ty=sy-(sy-ty)*nz/z;z=nz;apply()};
 svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX,e.clientY)},{passive:false});
 svg.addEventListener("pointerdown",e=>{drag=[e.clientX,e.clientY,tx,ty];moved=false;svg.setPointerCapture(e.pointerId)});
 svg.addEventListener("pointermove",e=>{if(drag){const r=svg.getBoundingClientRect(),s=Math.min(r.width/MW,r.height/MH),dx=(e.clientX-drag[0])/s,dy=(e.clientY-drag[1])/s;if(Math.abs(dx)+Math.abs(dy)>3)moved=true;tx=drag[2]+dx;ty=drag[3]+dy;apply()}});
 svg.addEventListener("pointerup",e=>{drag=null;if(!moved){const pin=document.elementFromPoint(e.clientX,e.clientY)?.closest("[data-pin]");if(pin)selectPin(+pin.dataset.pin)}});
 document.getElementById("zin").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.3,r.left+r.width/2,r.top+r.height/2)};
 document.getElementById("zout").onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.3,r.left+r.width/2,r.top+r.height/2)};
 svg.querySelectorAll(".pin").forEach(p=>{p.addEventListener("pointerenter",()=>{const d=DEVS[+p.dataset.pin],pr=p.getBoundingClientRect(),br=svg.parentElement.getBoundingClientRect();tip.innerHTML=`<b>${esc(d.name)}</b><small>${esc(d.address)}</small>`;tip.style.left=(pr.left+pr.width/2-br.left)+"px";tip.style.top=(pr.bottom-br.top)+"px";tip.style.opacity=1});p.addEventListener("pointerleave",()=>tip.style.opacity=0)});
 selectPin(S.mapSel??DEVS[0].id)}
function selectPin(id){S.mapSel=id;const d=DEVS[id];document.querySelectorAll(".pin").forEach(p=>p.classList.toggle("on",+p.dataset.pin===id));
 const on=document.querySelector(`.pin[data-pin="${id}"]`);on?.parentNode.appendChild(on);

 if(found.length===1){const d=found[0],r=REVS.filter(x=>x.dev===d.name).sort((a,b)=>b.rating-a.rating)[0];return{text:`${d.name} — ${d.klass}, ${d.district} район.\nИндекс комфорта: ${d.score}/100 · ${d.mood}.\nСильные стороны: ${d.pros.join(", ")||"—"}.\nНа что обратить внимание: ${d.cons.join(", ")||"нет явных минусов в отзывах"}.${r?`\n\nИз отзывов: «${r.text.slice(0,140)}${r.text.length>140?"…":""}» — ${r.author}, ★${r.rating}`:""}`,cards:[d.id]}}
 let m=s.match(/(\d+[.,]?\d*)\s*(млн|mln|миллион)/),budget=m?parseFloat(m[1].replace(",",".")):(/(дешев|недорог|бюджет|арзан)/.test(s)?30:0);
 if(budget){const it=rank(DEVS.filter(d=>d.buyM<=budget)).slice(0,4);if(!it.length){const c=[...DEVS].sort((a,b)=>a.buyM-b.buyM)[0];return{text:`В пределах ${budget} млн ₸ ничего не нашёл. Самый доступный вариант — ${c.name} (${c.buy} ₸).`,cards:[c.id]}}
  return{text:`Варианты до ${budget} млн ₸ — отсортировал по комфорту для вас:\n${it.map((d,i)=>`${i+1}. ${d.name} — ${d.buy} ₸ · ${d.score}/100`).join("\n")}`,cards:it.map(d=>d.id)}}
 const dmap={"есил":"Есильский","алматин":"Алматинский","сарыарк":"Сарыаркинский","байконур":"Байконурский","нура":"Нура"};
 for(const[k,v]of Object.entries(dmap))if(s.includes(k)){const it=rank(DEVS.filter(d=>d.district===v)).slice(0,5);return{text:`ЖК в районе «${v}»:\n${it.map(d=>`• ${d.name} — ${d.score}/100`).join("\n")}`,cards:it.slice(0,3).map(d=>d.id)}}
 const fam=/(сем|дет|ребён|ребен|family|kids|бала)/.test(s);
 const cw={"Тишина":["тих","тиш","шум","спокой"],"Транспорт":["транспорт","метро","lrt","добира","центр"],"Безопасность":["безопас","охран","камер"],"Двор":["двор","площадк","парков","зелен"],"Сервис":["сервис"," ук","управля","кск","чист"]};
 const cat=fam?null:Object.keys(cw).find(c=>cw[c].some(w=>s.includes(w)));
 if(cat){const it=rank(DEVS,cat).slice(0,3),r=REVS.find(x=>x.dev===it[0].name&&cw[cat].some(w=>x.text.toLowerCase().includes(w.trim()))&&x.rating>=4);
  return{text:`Лучшие ЖК по критерию «${cat==="Сервис"?"сервис УК":cat.toLowerCase()}»:\n${it.map((d,i)=>`${i+1}. ${d.name} — ${d.cats[cat]}/100 (${d.district})`).join("\n")}${r?`\n\nИз отзывов: «${r.text.slice(0,130)}…» — ${r.author}, ★${r.rating}`:""}`,cards:it.map(d=>d.id)}}
 if(fam||/(лучш|топ|посовет|рекоменд|подбер|подойд|best|recommend|таңда)/.test(s)){const p=fam?{"Двор и условия для детей":5,"Безопасность":5,"Школы и детские сады":4,"Тишина":3}:prefs,it=[...DEVS].sort((a,b)=>personal(b,p)-personal(a,p)).slice(0,3);
  return{text:`${fam?"Для семьи с детьми":"По вашему профилю комфорта"} лучше всего подходят:\n${it.map((d,i)=>`${i+1}. ${d.name} — совпадение ${personal(d,p)}% · ${d.pros.slice(0,2).join(", ")}`).join("\n")}`,cards:it.map(d=>d.id),mood:"happy"}}
 return{text:"Пока не уверен, что понял вопрос 🤔 Попробуйте спросить по-другому или выберите подсказку ниже.",chips:["Подбери ЖК для семьи","Самый тихий ЖК","Что до 35 млн?","Что умеешь?"]}}

function pReviews(){return `<div class="head"><div><h1>Отзывы</h1><p class="sub">Все сохранённые отзывы с указанием источника.</p></div></div>
 <section class="card filters"><div class="frow"><label class="field">${I("search")}<input id="rq" placeholder="Поиск по тексту, автору или ЖК" value="${esc(S.revQ)}" autocomplete="off"></label>
 <div class="seg" id="rateSeg"><span class="knob"></span>${["Все","★5","★4","★≤3"].map((l,i)=>`<button data-rate="${i}" class="${i===S.revR?"on":""}">${l}</button>`).join("")}</div></div></section>
 <div class="found tnum" id="rfound"></div><section class="grid stagger" id="rgrid" style="grid-template-columns:repeat(auto-fill,minmax(380px,1fr))"></section>`}
function fillReviews(){const g=document.getElementById("rgrid");if(!g)return;const q=S.revQ.trim().toLowerCase();let it=REVS.filter(r=>!q||(r.text+" "+r.author+" "+r.dev).toLowerCase().includes(q));
 it=it.filter(r=>[()=>true,()=>r.rating===5,()=>r.rating===4,()=>r.rating<=3][S.revR]());document.getElementById("rfound").textContent=`Найдено: ${it.length}`;
 g.innerHTML=it.length?it.slice(0,40).map(r=>revCard(r)).join(""):emptyState("Ничего не нашлось","Попробуйте другой запрос.");requestAnimationFrame(placeKnobs)}

/* ---------- palette ---------- */
function openPalette(){if(document.getElementById("pal"))return;const o=document.createElement("div");o.className="overlay";o.id="pal";
 o.innerHTML=`<div class="card pal" role="dialog" aria-label="Быстрый поиск"><label class="field">${I("search")}<input id="pq" placeholder="Поиск по ЖК, разделам и действиям…" autocomplete="off"><kbd>Esc</kbd></label><div class="list" id="plist"></div></div>`;
 document.body.appendChild(o);const inp=o.querySelector("#pq");let items=[],sel=0;
 const fill=()=>{const q=inp.value.trim().toLowerCase();const ds=DEVS.filter(d=>!q||(d.name+" "+d.district+" "+d.address).toLowerCase().includes(q)).slice(0,6);
  const pages=[...NAV.map(n=>n[0]),"reviews"].filter(r=>!q||t(r).toLowerCase().includes(q));items=[...ds.map(d=>({k:"d",d})),...pages.map(r=>({k:"p",r})),...(q.length>2?[{k:"a",q:inp.value}]:[])];sel=0;
  let h="",last="";items.forEach((it,i)=>{const grp=it.k==="d"?"Жилые комплексы":it.k==="p"?"Разделы":"ИИ-помощник";if(grp!==last){h+=`<div class="grp">${grp.toUpperCase()}</div>`;last=grp}
   h+=it.k==="d"?`<button class="it" data-i="${i}">${I("building")}<span>${esc(it.d.name)}</span><small>${it.d.district} · ${it.d.score}/100</small></button>`:it.k==="p"?`<button class="it" data-i="${i}">${I(NAV.find(n=>n[0]===it.r)?.[1]||"chat")}<span>${t(it.r)}</span></button>`:`<button class="it" data-i="${i}">${I("sparkle")}<span>Спросить Доми: «${esc(it.q)}»</span></button>`});
  o.querySelector("#plist").innerHTML=h||`<div class="grp">НИЧЕГО НЕ НАЙДЕНО</div>`;mark()};
 const mark=()=>o.querySelectorAll(".it").forEach(b=>b.classList.toggle("on",+b.dataset.i===sel));
 const act=i=>{const it=items[i];if(!it)return;close();if(it.k==="d")go("complex-"+it.d.id);else if(it.k==="p")go(it.r);else ask(it.q)};
 const close=()=>o.remove();
 inp.addEventListener("input",fill);inp.addEventListener("keydown",e=>{if(e.key==="ArrowDown"){sel=Math.min(items.length-1,sel+1);mark();e.preventDefault()}else if(e.key==="ArrowUp"){sel=Math.max(0,sel-1);mark();e.preventDefault()}else if(e.key==="Enter"){act(sel)}else if(e.key==="Escape")close()});
 o.addEventListener("click",e=>{const b=e.target.closest(".it");if(b)act(+b.dataset.i);else if(e.target===o)close()});fill();setTimeout(()=>inp.focus(),30)}

/* ---------- login ---------- */
function showLogin(){S.loggedIn=false;const el=document.createElement("div");el.className="login";el.id="login";
 el.innerHTML=`<section class="lart"><div class="brand" style="position:relative"><span class="mark" style="width:44px;height:44px">${I("home")}</span><b style="font-size:20px">HouseCheck AI</b></div>${mascot("is-happy")}
 <h2 style="position:relative">Найдите дом,<br>в котором хочется жить</h2>${[["star","Индекс комфорта по отзывам жителей"],["map","Интерактивная карта Астаны"],["sparkle","ИИ-помощник Доми 24/7"]].map(([ic,l])=>`<div class="feat" style="position:relative"><span class="bubble">${I(ic)}</span>${l}</div>`).join("")}</section>
 <section class="lform"><form id="lf" novalidate><h1>С возвращением!</h1><p class="sub">Войдите, чтобы открыть рабочую область.</p><label for="lu">Логин</label><input id="lu" value="super_admin" autocomplete="username"><label for="lp">Пароль</label><input id="lp" type="password" placeholder="super_admin" autocomplete="current-password">
 <div class="err" id="lerr"></div><button class="btn primary lg">${I("next")}Войти</button><p class="sub" style="font-size:12px">Демо-вход: super_admin / super_admin</p></form></section>`;
 document.body.appendChild(el);setTimeout(()=>el.querySelector("#lp").focus(),100);
 el.querySelector("#lf").onsubmit=e=>{e.preventDefault();const u=el.querySelector("#lu").value.trim(),p=el.querySelector("#lp").value;
  if(u==="super_admin"&&p==="super_admin"){S.loggedIn=true;el.classList.add("leaving");setTimeout(()=>el.remove(),480);if(!VALID.includes(location.hash.slice(1))&&!/^#complex-/.test(location.hash))location.hash="home";else render();renderShell();setTimeout(()=>toast("Добро пожаловать в HouseCheck AI!"),400)}
  else{el.querySelector("#lerr").textContent="Неверный логин или пароль. Подсказка: super_admin / super_admin";const f=el.querySelector("form");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake")}}}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const el=e.target.closest("[data-fav],[data-cmp],[data-uncmp],[data-open],[data-go],[data-toast],[data-district],[data-klass],[data-mode],[data-rate],[data-preset],[data-ask],[data-pinsel],[data-theme-i],[data-lang],#openPal,#logout,#clearCmp,#saveNote,#saveProfile");if(!el)return;
 if(el.dataset.fav!==undefined){e.stopPropagation();const id=+el.dataset.fav,on=!S.fav.has(id);on?S.fav.add(id):S.fav.delete(id);save();toast(on?"Добавлено в избранное":"Убрано из избранного");updateCounts("favorites");
  if(el.classList.contains("fav")){el.classList.toggle("on",on);el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop");if(curRoute().name==="favorites"&&!on)setTimeout(render,250)}else render();return}
 if(el.dataset.cmp!==undefined){e.stopPropagation();const id=+el.dataset.cmp;if(S.cmp.has(id))S.cmp.delete(id);else{if(S.cmp.size>=3){toast("Можно сравнить максимум три ЖК",false);return}S.cmp.add(id);toast("Добавлено в сравнение")}save();updateCounts("compare");
  if(curRoute().name==="catalog")fillCatalog();else render();return}
 if(el.dataset.uncmp!==undefined){e.stopPropagation();S.cmp.delete(+el.dataset.uncmp);save();updateCounts("compare");render();return}
 if(el.dataset.open!==undefined){go("complex-"+el.dataset.open);return}
 if(el.dataset.go!==undefined){go(el.dataset.go);return}
 if(el.dataset.toast){toast(el.dataset.toast,false);return}
 if(el.dataset.district!==undefined){S.district=el.dataset.district;document.querySelectorAll("[data-district]").forEach(c=>c.classList.toggle("on",c.dataset.district===S.district));fillCatalog();return}
 if(el.dataset.klass!==undefined){S.klass=S.klass===el.dataset.klass?"":el.dataset.klass;document.querySelectorAll("[data-klass]").forEach(c=>c.classList.toggle("on",c.dataset.klass===S.klass));fillCatalog();return}
 if(el.dataset.mode!==undefined){S.mode=+el.dataset.mode;segOn(el);fillCatalog();return}
 if(el.dataset.rate!==undefined){S.revR=+el.dataset.rate;segOn(el);fillReviews();return}
 if(el.dataset.preset!==undefined){const p=PRESETS[+el.dataset.preset][2];CRITERIA.forEach(([c])=>S.prefs[c]=p[c]||0);document.querySelectorAll(".preset").forEach(b=>b.classList.toggle("on",b===el));
  document.querySelectorAll("input[data-crit]").forEach(r=>{r.value=S.prefs[r.dataset.crit]||0;r.dispatchEvent(new Event("input"))});return}
 if(el.dataset.ask!==undefined){ask(el.dataset.ask);return}
 if(el.dataset.pinsel!==undefined){selectPin(+el.dataset.pinsel);return}
 if(el.dataset.themeI!==undefined){const i=+el.dataset.themeI;if(i===2)delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=i?"dark":"light";store.set("theme",i);segOn(el);return}
 if(el.dataset.lang!==undefined){S.lang=el.dataset.lang;store.set("lang",S.lang);renderShell();render();return}
 if(el.id==="openPal"){openPalette();return}
 if(el.id==="logout"){showLogin();return}
 if(el.id==="clearCmp"){S.cmp.clear();save();updateCounts("compare");fillCatalog();return}
 if(el.id==="saveNote"){const id=curRoute().id;S.notes[id]=document.getElementById("note").value;save();toast("Заметка сохранена");return}
 if(el.id==="saveProfile"){save();toast("Профиль комфорта сохранён");return}});
function segOn(btn){const s=btn.closest(".seg");s.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===btn));placeKnobs()}
document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(S.loggedIn)openPalette()}
 if(e.key==="Enter"&&e.target.matches?.("article[data-open]"))go("complex-"+e.target.dataset.open)});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;clearTimeout(window._qt);window._qt=setTimeout(fillCatalog,140)}if(e.target.id==="rq"){S.revQ=e.target.value;clearTimeout(window._rt);window._rt=setTimeout(fillReviews,140)}});
document.addEventListener("change",e=>{if(e.target.id==="sort"){S.sort=+e.target.value;fillCatalog()}});
window.addEventListener("resize",()=>{placeKnobs();clearTimeout(window._rz);window._rz=setTimeout(()=>paintCovers(),150)});
setInterval(()=>{const f=document.getElementById("floater");if(!f||f.hidden)return;f.classList.add("show");setTimeout(()=>f.classList.remove("show"),3800)},9000);
setTimeout(()=>document.getElementById("floater")?.classList.add("show"),1800);setTimeout(()=>document.getElementById("floater")?.classList.remove("show"),5600);

/* ---------- boot ---------- */
{const th=store.get("theme",2);if(th===1)document.documentElement.dataset.theme="dark";else if(th===0)document.documentElement.dataset.theme="light"}
window.removeEventListener("hashchange",render);
const baseRender=render;
render=function(){baseRender();const r=curRoute().name;if(r==="catalog")fillCatalog();if(r==="reviews")fillReviews();requestAnimationFrame(placeKnobs)};
window.addEventListener("hashchange",()=>render());
renderShell();
showLogin();
</script>
